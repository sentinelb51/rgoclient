name: Go Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Go's own codegen level for the Go half. It costs no compatibility that is not
# already spent: gopus compiles libopus with -march=x86-64-v3, so an amd64 build
# needs Haswell or newer regardless. Ignored on the arm64 leg.
env:
  GOAMD64: v3

# A second push supersedes the first: three runners apiece is too much to spend
# on a commit nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so the three builds stamp the same number rather than each
  # counting the tags for itself.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tags are what the version below counts from.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The version a release cut now would take, with a -dev suffix so a CI
      # artifact can never be mistaken for that release. No tag is involved, so
      # the number is a guess: the release that claims it may be a later build.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $now = [datetime]::UtcNow
          $base = "{0}.{1}" -f ($now.Year % 100), $now.Month

          $used = git tag --list "$base.*" "v$base.*" | ForEach-Object {
            if ($_ -match '\.(\d+)$') { [int]$Matches[1] }
          }
          $last = ($used | Measure-Object -Maximum).Maximum
          if (-not $last) { $last = 0 }

          "version=$base.$($last + 1)-dev" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # fail-fast off: one platform breaking is the thing the other two are here
    # to tell apart from a break everywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary: RGOClient.exe
            # Only the PE linker takes a subsystem, and it is what keeps a
            # console from opening behind the window. Passing it anywhere else
            # is a link error, not a no-op.
            ldflags: -H windowsgui
          - os: ubuntu-latest
            target: linux-amd64
            binary: RGOClient
            ldflags: ""
          - os: macos-latest
            target: macos-arm64
            binary: RGOClient
            ldflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cgo headers the module graph needs and the image does not ship: GL for
      # Fyne's GLFW, X11 and Wayland for both its display backends (glfw v3.4
      # compiles both unless -tags x11) and for golang.design/x/clipboard,
      # xkbcommon for the keymap, ALSA for oto. macOS and Windows have their
      # equivalents in the toolchain already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/ui mounts real widgets, so the tests need the same cgo toolchain
      # the build does; they are not a pure-Go unit suite.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      # Linked exactly as release.yml links it, -s -w included: what differs
      # between a CI build and a release should be the version stamp alone.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${{ needs.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/${{ matrix.binary }} ./cmd/rgoclient

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RGOClient-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
