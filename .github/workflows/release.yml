name: Release

# workflow_dispatch is the normal path: the run derives today's calendar
# version and creates the tag itself. Pushing a v* tag is the escape hatch —
# the tag is taken verbatim as the version.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # YY.M.D, UTC, unpadded (26.7.29); a second release on the same day
      # appends a counter (26.7.29.1) so the tag stays unique.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $version = $tag -replace '^v', ''
          } else {
            git fetch --tags --quiet
            $now = [datetime]::UtcNow
            $base = "{0}.{1}.{2}" -f ($now.Year % 100), $now.Month, $now.Day

            $version = $base
            $n = 1
            while (git tag --list "v$version") {
              $version = "$base.$n"
              $n++
            }

            $tag = "v$version"
            git tag $tag
            git push origin $tag
          }

          Write-Host "Releasing $tag (version $version, build $env:GITHUB_RUN_NUMBER)"
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "-H windowsgui -X main.version=${{ steps.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/RGOClient.exe ./cmd/rgoclient

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: dist/RGOClient.exe
          generate_release_notes: true
