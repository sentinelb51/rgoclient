name: Release

# workflow_dispatch is the normal path: the run derives this month's version
# and creates the tag itself. The other two are escape hatches taking the tag
# verbatim — a tag pushed by hand, with or without the v, and a release drafted
# in the web UI, which fires `release` and not always `push`. One release can
# fire both, so the concurrency group keeps them off each other.
on:
  push:
    tags: [ 'v*', '[0-9]*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # Ahead of the version job, which pushes the tag: a failure on any platform
  # must not leave a tag behind pointing at a tree that never built.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/ui mounts real widgets, so the tests need the same cgo toolchain
      # the build does; they are not a pure-Go unit suite.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

  # One job, because it pushes the tag: three matrix legs resolving the version
  # would race to create it.
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # YY.M.N, UTC, unpadded (26.8.1): the year and month it shipped in, then a
      # counter that restarts each month. The highest tag already in this month
      # decides the counter, so a gap in the tags never repeats a version.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Notes are generated for a release this run brings into being, and
          # never for one already published with a body someone wrote.
          if ($env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG
            $notes = $false
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $notes = $true
          } else {
            git fetch --tags --quiet
            $now = [datetime]::UtcNow
            $base = "{0}.{1}" -f ($now.Year % 100), $now.Month

            # Both spellings: the tags predating this scheme carry a v, and a
            # hand-pushed one still might. Either way it occupies that number.
            $used = git tag --list "$base.*" "v$base.*" | ForEach-Object {
              if ($_ -match '\.(\d+)$') { [int]$Matches[1] }
            }
            $last = ($used | Measure-Object -Maximum).Maximum
            if (-not $last) { $last = 0 }

            $tag = "$base.$($last + 1)"
            $notes = $true
            git tag $tag
            git push origin $tag
          }

          $version = $tag -replace '^v', ''

          Write-Host "Releasing $tag (version $version, build $env:GITHUB_RUN_NUMBER)"
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$($notes.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary: RGOClient.exe
            # Only the PE linker takes a subsystem, and it is what keeps a
            # console from opening behind the window. Passing it anywhere else
            # is a link error, not a no-op.
            ldflags: -H windowsgui
          - os: ubuntu-latest
            target: linux-amd64
            binary: RGOClient
            ldflags: ""
          - os: macos-latest
            target: macos-arm64
            binary: RGOClient
            ldflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cgo headers the module graph needs and the image does not ship: GL for
      # Fyne's GLFW, X11 and Wayland for both its display backends (glfw v3.4
      # compiles both unless -tags x11) and for golang.design/x/clipboard,
      # xkbcommon for the keymap, ALSA for oto. macOS and Windows have their
      # equivalents in the toolchain already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "${{ matrix.ldflags }} -X main.version=${{ needs.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/${{ matrix.binary }} ./cmd/rgoclient

      - name: Name the Windows asset
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/RGOClient.exe "dist/RGOClient-${{ matrix.target }}.exe"

      # A release asset is downloaded as-is and an artifact is re-zipped, and
      # neither keeps the execute bit — so the unix builds ship in a tar, which
      # does.
      - name: Archive the unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/RGOClient
          tar -czf "dist/RGOClient-${{ matrix.target }}.tar.gz" -C dist RGOClient
          rm dist/RGOClient

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RGOClient-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v8
        with:
          pattern: RGOClient-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: ${{ needs.version.outputs.notes }}
