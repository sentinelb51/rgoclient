name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-H windowsgui" -o dist/RGOClient.exe ./cmd/rgoclient

      # Self-signed only: proves the signing pipeline works and gives a verifiable
      # Authenticode signature, but does NOT clear SmartScreen or show a trusted
      # publisher name on end-user machines (no real CA backs this certificate).
      # The certificate is persistent (generated once, stored as a secret) rather
      # than regenerated per run, so its identity/thumbprint stays stable across
      # builds, which matters for SmartScreen reputation.
      - name: Import code-signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable
          Remove-Item $pfxPath

          # Trust the cert within this job only, so the signature verifies as
          # "Valid" in CI. This has no effect on trust outside this runner.
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign executable
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT"
          $sig = Set-AuthenticodeSignature -FilePath dist\RGOClient.exe -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          $sig | Format-List
          if ($sig.Status -ne "Valid") {
            throw "Signing failed or signature not valid: $($sig.StatusMessage)"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RGOClient.exe
          generate_release_notes: true
