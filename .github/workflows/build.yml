name: Go Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Today's calendar version with a -dev suffix, so a CI artifact can never
      # be mistaken for the release cut on the same day. No tag is involved.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $now = [datetime]::UtcNow
          $version = "{0}.{1}.{2}-dev" -f ($now.Year % 100), $now.Month, $now.Day
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "-H windowsgui -X main.version=${{ steps.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/RGOClient.exe ./cmd/rgoclient

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGOClient-windows
          path: dist/RGOClient.exe
          if-no-files-found: error
