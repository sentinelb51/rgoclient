name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-H windowsgui" -o dist/RGOClient.exe ./cmd/rgoclient

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RGOClient.exe
          generate_release_notes: true
