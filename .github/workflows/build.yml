name: Go Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-H windowsgui" -o dist/RGOClient.exe ./cmd/rgoclient

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGOClient-windows
          path: dist/RGOClient.exe
          if-no-files-found: error
