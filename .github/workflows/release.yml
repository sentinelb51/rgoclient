name: Release

# workflow_dispatch is the normal path: the run derives this month's version and
# the release at the end mints the tag. The other two are escape hatches taking
# the tag verbatim — a tag pushed by hand, with or without the v, and a release
# drafted in the web UI, which fires `release` and not always `push`. One release
# can fire both, so the concurrency group keeps them off each other.
on:
  push:
    tags: [ 'v*', '[0-9]*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

# Go's own codegen level for the Go half. It costs no compatibility that is not
# already spent: gopus compiles libopus with -march=x86-64-v3, so an amd64 build
# needs Haswell or newer regardless. Ignored on the arm64 leg.
env:
  GOAMD64: v3

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # One job, so the three build legs stamp the same number rather than each
  # counting the tags for itself.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # YY.M.N, UTC, unpadded (26.8.1): the year and month it shipped in, then a
      # counter that restarts each month. The highest tag already in this month
      # decides the counter, so a gap in the tags never repeats a version.
      #
      # The tag is resolved here and created by the release at the end, so a
      # failure on any platform cannot leave one behind pointing at a tree that
      # never built.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Notes are generated for a release this run brings into being, and
          # never for one already published with a body someone wrote.
          if ($env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG
            $notes = $false
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $notes = $true
          } else {
            $now = [datetime]::UtcNow
            $base = "{0}.{1}" -f ($now.Year % 100), $now.Month

            # Both spellings: the tags predating this scheme carry a v, and a
            # hand-pushed one still might. Either way it occupies that number.
            $used = git tag --list "$base.*" "v$base.*" | ForEach-Object {
              if ($_ -match '\.(\d+)$') { [int]$Matches[1] }
            }
            $last = ($used | Measure-Object -Maximum).Maximum
            if (-not $last) { $last = 0 }

            $tag = "$base.$($last + 1)"
            $notes = $true
          }

          $version = $tag -replace '^v', ''

          Write-Host "Releasing $tag (version $version, build $env:GITHUB_RUN_NUMBER)"
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$($notes.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  # Tests and the build are one leg per platform: split across two jobs they pay
  # for the checkout, the cgo headers and the whole dependency compile twice.
  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # fail-fast off: one platform breaking is the thing the other two are here
    # to tell apart from a break everywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary: RGOClient.exe
            # Only the PE linker takes a subsystem, and it is what keeps a
            # console from opening behind the window. Passing it anywhere else
            # is a link error, not a no-op.
            ldflags: -H windowsgui
            # A bare exe is worth zipping into the artifact; the tarballs below
            # are already compressed, so a second pass only costs CPU.
            compression: 6
          - os: ubuntu-latest
            target: linux-amd64
            binary: RGOClient
            ldflags: ""
            compression: 0
          - os: macos-latest
            target: macos-arm64
            binary: RGOClient
            ldflags: ""
            compression: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cgo headers the module graph needs and the image does not ship: GL for
      # Fyne's GLFW, X11 and Wayland for both its display backends (glfw v3.4
      # compiles both unless -tags x11) and for golang.design/x/clipboard,
      # xkbcommon for the keymap, ALSA for oto. macOS and Windows have their
      # equivalents in the toolchain already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/ui mounts real widgets, so the tests need the same cgo toolchain
      # the build does; they are not a pure-Go unit suite.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "${{ matrix.ldflags }} -X main.version=${{ needs.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/${{ matrix.binary }} ./cmd/rgoclient

      - name: Name the Windows asset
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/RGOClient.exe "dist/RGOClient-${{ matrix.target }}.exe"

      # A release asset is downloaded as-is and an artifact is re-zipped, and
      # neither keeps the execute bit — so the unix builds ship in a tar, which
      # does.
      - name: Archive the unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/RGOClient
          tar -czf "dist/RGOClient-${{ matrix.target }}.tar.gz" -C dist RGOClient
          rm dist/RGOClient

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RGOClient-${{ matrix.target }}
          path: dist/*
          compression-level: ${{ matrix.compression }}
          if-no-files-found: error

  publish:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v8
        with:
          pattern: RGOClient-*
          merge-multiple: true
          path: dist

      # This is what creates the tag on the dispatch path, which is why nothing
      # earlier pushes one. target_commitish has to be named: left out, the tag
      # is cut from the default branch's head rather than the tree that was
      # tested. On the two escape hatches the tag already exists and is kept.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: ${{ needs.version.outputs.notes }}
