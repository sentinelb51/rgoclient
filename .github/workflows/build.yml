name: Go Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The tags are what the version below counts from.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/ui mounts real widgets, so the tests need the same cgo toolchain
      # the build does; they are not a pure-Go unit suite.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      # The version a release cut now would take, with a -dev suffix so a CI
      # artifact can never be mistaken for that release. No tag is involved, so
      # the number is a guess: the release that claims it may be a later build.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $now = [datetime]::UtcNow
          $base = "{0}.{1}" -f ($now.Year % 100), $now.Month

          $used = git tag --list "v$base.*" | ForEach-Object {
            if ($_ -match '\.(\d+)$') { [int]$Matches[1] }
          }
          $last = ($used | Measure-Object -Maximum).Maximum
          if (-not $last) { $last = 0 }

          "version=$base.$($last + 1)-dev" >> $env:GITHUB_OUTPUT

      - name: Build
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "-H windowsgui -X main.version=${{ steps.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/RGOClient.exe ./cmd/rgoclient

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGOClient-windows
          path: dist/RGOClient.exe
          if-no-files-found: error
