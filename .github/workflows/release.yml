name: Release

# workflow_dispatch is the normal path: the run derives this month's version and
# the release at the end mints the tag. The other two are escape hatches taking
# the tag verbatim — a tag pushed by hand, with or without the v, and a release
# drafted in the web UI, which fires `release` and not always `push`. One release
# can fire both, so the concurrency group keeps them off each other.
on:
  push:
    tags: [ 'v*', '[0-9]*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

# Go's own codegen level for the Go half. It costs no compatibility that is not
# already spent: gopus compiles libopus with -march=x86-64-v3, so an amd64 build
# needs Haswell or newer regardless. Ignored on the arm64 leg.
env:
  GOAMD64: v3

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # One job, so the three build legs stamp the same number rather than each
  # counting the tags for itself.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # YY.M.N, UTC, unpadded (26.8.1): the year and month it shipped in, then a
      # counter that restarts each month. The highest tag already in this month
      # decides the counter, so a gap in the tags never repeats a version.
      #
      # The tag is resolved here and created by the release at the end, so a
      # failure on any platform cannot leave one behind pointing at a tree that
      # never built.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Notes are generated for a release this run brings into being, and
          # never for one already published with a body someone wrote.
          if ($env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG
            $notes = $false
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $notes = $true
          } else {
            $now = [datetime]::UtcNow
            $base = "{0}.{1}" -f ($now.Year % 100), $now.Month

            # Both spellings: the tags predating this scheme carry a v, and a
            # hand-pushed one still might. Either way it occupies that number.
            $used = git tag --list "$base.*" "v$base.*" | ForEach-Object {
              if ($_ -match '\.(\d+)$') { [int]$Matches[1] }
            }
            $last = ($used | Measure-Object -Maximum).Maximum
            if (-not $last) { $last = 0 }

            $tag = "$base.$($last + 1)"
            $notes = $true
          }

          $version = $tag -replace '^v', ''

          Write-Host "Releasing $tag (version $version, build $env:GITHUB_RUN_NUMBER)"
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$($notes.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  # Tests and the build are one leg per platform: split across two jobs they pay
  # for the checkout, the cgo headers and the whole dependency compile twice.
  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # fail-fast off: one platform breaking is the thing the other two are here
    # to tell apart from a break everywhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary: RGOClient.exe
            # Only the PE linker takes a subsystem, and it is what keeps a
            # console from opening behind the window. Passing it anywhere else
            # is a link error, not a no-op.
            ldflags: -H windowsgui
          - os: ubuntu-latest
            target: linux-amd64
            binary: RGOClient
            ldflags: ""
          - os: macos-latest
            target: macos-arm64
            binary: RGOClient
            ldflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cgo headers the module graph needs and the image does not ship: GL for
      # Fyne's GLFW, X11 and Wayland for both its display backends (glfw v3.4
      # compiles both unless -tags x11) and for golang.design/x/clipboard,
      # xkbcommon for the keymap, ALSA for oto. macOS and Windows have their
      # equivalents in the toolchain already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/ui mounts real widgets, so the tests need the same cgo toolchain
      # the build does; they are not a pure-Go unit suite.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      # -s -w drop the symbol table and DWARF: a quarter of the binary, and
      # everything a debugger would attach with. A panic keeps its function names
      # and line numbers either way — those come from the pclntab, which the
      # runtime itself walks and neither flag touches.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: >
          go build
          -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${{ needs.version.outputs.version }} -X main.build=${{ github.run_number }}"
          -o dist/${{ matrix.binary }} ./cmd/rgoclient

      # A release asset is served as-is, so a bare exe would be the one download
      # arriving uncompressed — deflate takes ~45% off a Go binary. The exe inside
      # keeps its plain name, the way the tarballs' binary does. It buys nothing
      # against SmartScreen, which Explorer arms anyway by propagating the mark of
      # the web onto what it extracts; what it does avoid is the download-time
      # block a browser puts in front of an unsigned exe and not in front of a zip.
      - name: Archive the Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/RGOClient.exe -DestinationPath "dist/RGOClient-${{ matrix.target }}.zip"
          Remove-Item dist/RGOClient.exe

      # Linux gets the desktop entry, the icon and the installer beside the
      # binary — nothing is packaged or signed, so this is the honest middle
      # ground between a bare ELF and a .deb: one script, run as the user, that
      # puts the three files where a shell looks for them. macOS gets none of it,
      # a .app being what it would need and notarisation what that would need.
      - name: Add the Linux desktop files
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          cp packaging/linux/rgoclient.desktop packaging/linux/install.sh assets/rgo.png dist/
          chmod +x dist/install.sh

      # A release asset is downloaded as-is and an artifact is re-zipped, and
      # neither keeps the execute bit — so the unix builds ship in a tar, which
      # does.
      #
      # Staged through a directory of its own rather than tarred in place: the
      # archive is written into dist, and tar reading the directory it is writing
      # into can pick up its own partial output.
      - name: Archive the unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/RGOClient
          mkdir -p stage
          mv dist/* stage/
          tar -czf "dist/RGOClient-${{ matrix.target }}.tar.gz" -C stage .

      # Every asset is an archive by the time it gets here, so the zip an artifact
      # is wrapped in only costs CPU: store it.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RGOClient-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v8
        with:
          pattern: RGOClient-*
          merge-multiple: true
          path: dist

      # Nothing here is signed, so a checksum is the only thing a download can be
      # checked against at all. Written after the assets are collected and before
      # they are published, so the file covers exactly what the release carries.
      - name: Checksum the assets
        shell: bash
        working-directory: dist
        run: |
          sha256sum RGOClient-* > SHA256SUMS
          cat SHA256SUMS

      # This is what creates the tag on the dispatch path, which is why nothing
      # earlier pushes one. target_commitish has to be named: left out, the tag
      # is cut from the default branch's head rather than the tree that was
      # tested. On the two escape hatches the tag already exists and is kept.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: ${{ needs.version.outputs.notes }}
